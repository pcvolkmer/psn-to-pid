[package]
name = "psn-to-pid"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
log = "0.4"
axum = { version = "0.8", features = ["tracing"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = { version = "0.7", features = ["trace"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal"] }
quick-xml = { version = "0.42", features = ["serialize", "serde"] }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.13", features = ["rustls"], default-features = false }

# Lints

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
pedantic = { level = "warn", priority = -1 }

[lints.rust]
unused_must_use = "deny"

# Profiles

[profile.release]
opt-level = "s"
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"
